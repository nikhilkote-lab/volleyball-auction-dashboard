<!DOCTYPE html>
<html>
<head>
<title>Volleyball Auction Dashboard</title>

<style>
body{
font-family:Arial,sans-serif;
background:#0f172a;
color:white;
margin:0;
padding:0;
}

.header{
background:#f97316;
padding:20px;
text-align:center;
font-size:30px;
font-weight:bold;
}

.auction{
display:flex;
padding:20px;
gap:20px;
}

.player{
flex:2;
background:#1e293b;
padding:20px;
border-radius:10px;
}

.bidpanel{
flex:1;
background:#1e293b;
padding:20px;
border-radius:10px;
}

.player h2{
font-size:32px;
margin-top:0;
}

.bid{
font-size:48px;
color:#22c55e;
text-align:center;
margin:20px 0;
}

button{
padding:10px 15px;
margin:5px;
border:none;
border-radius:5px;
cursor:pointer;
font-weight:bold;
}

.orange{
background:#f97316;
color:white;
}

.green{
background:#22c55e;
color:white;
}

.teams{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
padding:20px;
}

.team{
background:#1e293b;
padding:10px;
border-radius:10px;
}

.team h3{
text-align:center;
color:#facc15;
}

.budget{
text-align:center;
color:#22c55e;
font-size:20px;
font-weight:bold;
}

.players{
min-height:120px;
}

.playeritem{
background:#334155;
padding:5px;
margin:5px 0;
border-radius:5px;
}

select{
width:100%;
padding:10px;
margin-bottom:10px;
}

@media(max-width:900px){
